# Builds Flecha for Arch Linux and Omarchy and publishes it as a GitHub release: the pacman
# package of flecha-git, and the tarball with the flecha-bin PKGBUILD that installs it. Then
# linux-aur.yml pushes flecha-bin and flecha-git to the AUR when an AUR_SSH_PRIVATE_KEY secret
# is set, so `yay -S flecha-bin` installs this build.
#
# One build takes longer than a GitHub-hosted job may run, so it runs in up to five stages
# (linux-stage.yml), each carrying on from the one before.
name: Linux package

on:
  workflow_dispatch:
  push:
    branches: [linux-port]
    paths:
      - 'chromium/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/linux-*.yml'

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stage1:
    uses: ./.github/workflows/linux-stage.yml
    with:
      first: true
  stage2:
    needs: stage1
    if: needs.stage1.outputs.done == 'false'
    uses: ./.github/workflows/linux-stage.yml
    with:
      first: false
  stage3:
    needs: stage2
    if: needs.stage2.outputs.done == 'false'
    uses: ./.github/workflows/linux-stage.yml
    with:
      first: false
  stage4:
    needs: stage3
    if: needs.stage3.outputs.done == 'false'
    uses: ./.github/workflows/linux-stage.yml
    with:
      first: false
  stage5:
    needs: stage4
    if: needs.stage4.outputs.done == 'false'
    uses: ./.github/workflows/linux-stage.yml
    with:
      first: false

  release:
    needs: [stage1, stage2, stage3, stage4, stage5]
    if: ${{ always() && contains(needs.*.outputs.done, 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: flecha-package
          path: dist
      - name: Publish the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="linux-v$version-$GITHUB_RUN_NUMBER"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          ls -la dist
          gh release create "$tag" --target "$GITHUB_SHA" --title "Flecha $version for Linux ($GITHUB_RUN_NUMBER)" \
            --notes "Flecha $version for Arch Linux and Omarchy (x86_64), built from $GITHUB_SHA.

          Install the package directly: \`sudo pacman -U flecha-git-*.pkg.tar.zst\`
          or with the flecha-bin PKGBUILD attached here: \`makepkg -si\` in a folder holding it." \
            dist/*.pkg.tar.zst dist/*.tar.xz dist/PKGBUILD

  aur:
    needs: release
    # always(): stages skipped after the build finished would otherwise skip this job too.
    if: ${{ always() && needs.release.result == 'success' }}
    uses: ./.github/workflows/linux-aur.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
